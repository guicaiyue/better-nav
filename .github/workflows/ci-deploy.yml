name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: better-nav-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Test, build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/better-nav:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/better-nav:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            NEXT_PUBLIC_APP_URL=https://nav.xirizhi.cn
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger n8n Watchtower after image push
        env:
          WEBHOOK_URL: ${{ secrets.N8N_WATCHTOWER_WEBHOOK_URL }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/better-nav
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_URL"
          payload=$(jq -nc --arg image "$IMAGE" '{image:$image}')
          status=$(curl --silent --show-error --fail-with-body             --connect-timeout 20 --max-time 180             -H 'Content-Type: application/json' --data "$payload"             --output response.json --write-out '%{http_code}' "$WEBHOOK_URL")
          cat response.json
          test "$status" = 200 -o "$status" = 202
          echo 'Request accepted. Verify n8n execution and running OCI revision separately.'
